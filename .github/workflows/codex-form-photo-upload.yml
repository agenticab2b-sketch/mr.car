name: Apply form photo upload implementation

on:
  push:
    branches:
      - codex/form-photo-upload

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check migration scripts
        run: |
          node --check scripts/apply-form-photo-upload.js
          node --check scripts/lead-form-upload.js

      - name: Apply source and static form changes
        run: node scripts/apply-form-photo-upload.js

      - name: Regenerate maintained pages
        run: node build.js

      - name: Reconcile standalone form pages
        run: node scripts/apply-form-photo-upload.js

      - name: Validate generated JavaScript and site quality
        run: |
          node --check scripts/lead-form-upload.js
          node --check functions/index.js
          node .github/scripts/quality-gate.js

      - name: Remove one-off migration files
        run: |
          rm scripts/apply-form-photo-upload.js
          rm .github/workflows/codex-form-photo-upload.yml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: add photo uploads to lead forms"
          git push origin HEAD:codex/form-photo-upload
