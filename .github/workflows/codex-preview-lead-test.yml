name: Apply preview lead test support

on:
  push:
    branches:
      - codex/form-photo-upload

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate migration
        run: node --check scripts/apply-preview-lead-test-fixed.js

      - name: Apply preview test support
        run: node scripts/apply-preview-lead-test-fixed.js

      - name: Regenerate maintained pages
        run: node build.js

      - name: Validate JavaScript and quality gate
        run: |
          node --check scripts/lead-form-upload.js
          node --check functions/index.js
          node .github/scripts/quality-gate.js

      - name: Remove one-off migration files
        run: |
          rm scripts/apply-preview-lead-test.js
          rm scripts/apply-preview-lead-test-fixed.js
          rm .github/workflows/codex-preview-lead-test.yml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "test: add end-to-end preview lead backend"
          git push origin HEAD:codex/form-photo-upload
